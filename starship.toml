# Starship — https://starship.rs/config
# Prompt en dos lineas: el comando siempre empieza en la misma columna,
# sin importar lo largo que sea el path o el nombre de la rama.

add_newline = true

format = """
$directory$git_branch$git_status$python$nodejs$rust$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
# Solo lo accionable: conflictos, cambios sin commitear, sin push
conflicted = "⚠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
stashed = "≡"

# Los runtimes solo aparecen dentro de un proyecto que los use.
# Asi el prompt refleja lo que mise ha activado de verdad.
[python]
symbol = " "
style = "bold yellow"
format = '[$symbol$version]($style) '

[nodejs]
symbol = " "
style = "bold green"
format = '[$symbol$version]($style) '

[rust]
symbol = " "
style = "bold red"
format = '[$symbol$version]($style) '

# Avisa cuando un comando tarda: util para no quedarte mirando la pantalla
[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "bold yellow"
