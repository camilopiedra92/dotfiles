# CI does not define any checks of its own: it installs what the runner is
# missing and then calls ./check.sh, the same script the pre-commit hook runs.
# Checks written in two places drift, and the moment CI and local disagree you
# stop trusting both. A green tick here means exactly what a clean local run
# means.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing here needs to write to the repo, and a workflow
# that cannot write cannot be turned into a supply-chain foothold.
permissions:
  contents: read

# A second push makes the first run irrelevant; cancel it instead of paying for
# both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS only, because that is the only platform this repo targets:
    # install.sh assumes Homebrew at the Apple Silicon prefix, links VS Code
    # under ~/Library, and the Brewfile installs casks.
    #
    # A Linux runner used to be here for BSD-versus-GNU divergence, but for a
    # macOS-only repo that reasoning points the other way. The one real bug it
    # was kept for was a BSD bug — grep reading a mid-pattern $ as an anchor —
    # which Linux passes and only macOS catches. It ran a strict subset of what
    # macOS runs, so it added no coverage, and the failures it could produce
    # were about a platform nobody here uses. A signal you have to learn to
    # ignore is worse than no signal.
    runs-on: macos-latest
    steps:
      # Pinned to a commit SHA rather than a tag: a tag can be moved to point at
      # different code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tools are downloaded at a pinned version instead of taken from the
      # runner's image, which drifts underneath you: a linter that reports a
      # different code for the same construct after an image update is a linter
      # you stop trusting. Pinning also keeps the run independent of brew, which
      # warns about untrusted taps it ships with — noise this job has no
      # business inheriting.
      #
      # These versions match what the Brewfile installs locally, so CI and your
      # machine run the same binaries. Bump both together.
      - name: Install tools
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHFMT_VERSION: v3.13.1
          # Bare, no leading v: actionlint's tag carries one but its filenames
          # do not, and both spellings appear below.
          ACTIONLINT_VERSION: 1.7.12
          GHOSTTY_VERSION: 1.3.1
          TAPLO_VERSION: 0.10.0
        run: |
          [ "$RUNNER_OS" = "macOS" ] || { echo "::error::unsupported runner: $RUNNER_OS"; exit 1; }
          sc_os=darwin; fmt_os=darwin
          # Architecture is still resolved rather than assumed: macos-latest has
          # already moved from x86 to Apple Silicon once. If it moves again the
          # checksum lookup fails loudly, which is the intended outcome.
          case "$RUNNER_ARCH" in
            X64)   sc_arch=x86_64;  fmt_arch=amd64 ;;
            ARM64) sc_arch=aarch64; fmt_arch=arm64 ;;
            *) echo "::error::unsupported arch: $RUNNER_ARCH"; exit 1 ;;
          esac

          # Downloading a binary and running it is only safe if you know what
          # you got, and a checksum published beside the artifact is no help;
          # the expected hashes live in this repo. See tool-checksums.txt.
          verify() { # verify <downloaded file> <name recorded in the checksum file>
            local expected actual
            expected=$(awk -v n="$2" '$2 == n { print $1 }' .github/tool-checksums.txt)
            # No recorded hash means an OS/arch nobody has vetted. Fail rather
            # than install something unverified.
            [ -n "$expected" ] || { echo "::error::no checksum recorded for $2"; exit 1; }
            actual=$(shasum -a 256 "$1" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || {
              echo "::error::checksum mismatch for $2: got $actual, expected $expected"
              exit 1
            }
          }

          sc_file="shellcheck-${SHELLCHECK_VERSION}.${sc_os}.${sc_arch}.tar.xz"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${sc_file}" -o "$sc_file"
          verify "$sc_file" "$sc_file"
          tar -xJf "$sc_file" --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"

          fmt_file="shfmt_${SHFMT_VERSION}_${fmt_os}_${fmt_arch}"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/${fmt_file}" -o "$fmt_file"
          verify "$fmt_file" "$fmt_file"
          install -m 755 "$fmt_file" /usr/local/bin/shfmt

          # taplo ships a bare gzipped binary rather than an archive, and spells
          # its architectures the way shellcheck does, so sc_arch covers it.
          tp_file="taplo-${sc_os}-${sc_arch}.gz"
          curl -fsSL "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VERSION}/${tp_file}" -o "$tp_file"
          verify "$tp_file" "$tp_file"
          gunzip -c "$tp_file" > taplo
          install -m 755 taplo /usr/local/bin/taplo

          # actionlint names its artifacts the same way shfmt does, so the same
          # os/arch pair covers both.
          al_file="actionlint_${ACTIONLINT_VERSION}_${fmt_os}_${fmt_arch}.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al_file}" -o "$al_file"
          verify "$al_file" "$al_file"
          tar -xzf "$al_file" -C /usr/local/bin actionlint

          # Ghostty is the only thing here that validates a config rather than
          # code. Two things this must not do, both found by trying them. The
          # binary cannot be lifted out of Ghostty.app: that breaks the code
          # signature and macOS kills it with SIGKILL, which surfaces as an
          # unexplained exit 137. And the bundle has to stay reachable, because
          # the binary locates its themes relative to its own real path —
          # without it, `theme = Catppuccin Mocha` fails to resolve and the run
          # goes red for a reason that has nothing to do with the config. A
          # symlink to the binary inside the intact bundle satisfies both.
          #
          # The bundle goes in the job's temp directory: /usr/local/bin is
          # writable on this image but /usr/local itself is not, and none of
          # this warrants sudo. Only the symlink needs to be on PATH.
          gt_file="ghostty-${GHOSTTY_VERSION}-macos-universal.zip"
          curl -fsSL "https://release.files.ghostty.org/${GHOSTTY_VERSION}/ghostty-macos-universal.zip" -o "$gt_file"
          verify "$gt_file" "$gt_file"
          unzip -q "$gt_file" -d "$RUNNER_TEMP/ghostty"
          ln -sf "$RUNNER_TEMP/ghostty/Ghostty.app/Contents/MacOS/ghostty" /usr/local/bin/ghostty

      # Presence used to be asserted here, with a hand-written list of tool
      # names, because check.sh silently skipped anything it could not find.
      # The list is gone: check.sh fails on a skip whenever CI is set, so a
      # missing tool goes red on its own. That list had already drifted — it
      # never mentioned ghostty, which is why this job reported success while
      # validating no Ghostty config at all. A duplicated list of what must be
      # installed is exactly the kind of thing that rots quietly.
      #
      # Versions are a different claim and still worth asserting: check.sh only
      # knows whether a tool ran, not whether it was the one we pinned, and a
      # linter that disagrees between machines is worse than no linter.
      - name: Tools are the pinned versions
        run: |
          shellcheck --version | grep -qx "version: 0.11.0" || {
            echo "::error::unexpected shellcheck: $(shellcheck --version | tr '\n' ' ')"
            exit 1
          }
          [ "$(shfmt --version)" = "v3.13.1" ] || {
            echo "::error::unexpected shfmt: $(shfmt --version)"
            exit 1
          }
          [ "$(actionlint --version | head -1)" = "1.7.12" ] || {
            echo "::error::unexpected actionlint: $(actionlint --version | head -1)"
            exit 1
          }
          ghostty +version | grep -qx "Ghostty 1.3.1" || {
            echo "::error::unexpected ghostty: $(ghostty +version | head -1)"
            exit 1
          }
          [ "$(taplo --version)" = "taplo 0.10.0" ] || {
            echo "::error::unexpected taplo: $(taplo --version)"
            exit 1
          }

      # CI is set by the runner, so this fails on any skipped check.
      - run: ./check.sh
