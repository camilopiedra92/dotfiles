# CI does not define any checks of its own: it installs what the runner is
# missing and then calls ./check.sh, the same script the pre-commit hook runs.
# Checks written in two places drift, and the moment CI and local disagree you
# stop trusting both. A green tick here means exactly what a clean local run
# means.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing here needs to write to the repo, and a workflow
# that cannot write cannot be turned into a supply-chain foothold.
permissions:
  contents: read

# A second push makes the first run irrelevant; cancel it instead of paying for
# both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Both platforms, because the scripts run on macOS but the cheap runner is
    # Linux, and the two disagree in ways that matter here: BSD and GNU differ
    # on grep patterns and on sed, which has already caused one real bug.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to a commit SHA rather than a tag: a tag can be moved to point at
      # different code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both tools are downloaded at a pinned version instead of taken from the
      # runner's package manager. A linter is only useful if it says the same
      # thing everywhere: the preinstalled shellcheck on Ubuntu and the one brew
      # gives macOS are different releases, and they already disagreed here
      # about which code an unused function gets. Pinning also keeps the run
      # independent of the runner image's state — brew warns about untrusted
      # taps it ships with, which is noise this job has no business inheriting.
      #
      # These versions match what the Brewfile installs locally, so CI and your
      # machine run the same binaries. Bump both together.
      - name: Install tools
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHFMT_VERSION: v3.13.1
        run: |
          case "$RUNNER_OS" in
            Linux)
              sc_os=linux; fmt_os=linux
              # macOS ships zsh; Debian does not.
              sudo apt-get install -y --no-install-recommends zsh
              ;;
            macOS) sc_os=darwin; fmt_os=darwin ;;
            *) echo "::error::unsupported runner: $RUNNER_OS"; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   sc_arch=x86_64;  fmt_arch=amd64 ;;
            ARM64) sc_arch=aarch64; fmt_arch=arm64 ;;
            *) echo "::error::unsupported arch: $RUNNER_ARCH"; exit 1 ;;
          esac

          # Downloading a binary and running it is only safe if you know what
          # you got. Neither project publishes checksums or attestations, so
          # the expected hashes live in this repo; see tool-checksums.txt.
          sha256() {
            if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi
          }
          verify() { # verify <downloaded file> <name recorded in the checksum file>
            local expected actual
            expected=$(awk -v n="$2" '$2 == n { print $1 }' .github/tool-checksums.txt)
            # No recorded hash means an OS/arch nobody has vetted. Fail rather
            # than install something unverified.
            [ -n "$expected" ] || { echo "::error::no checksum recorded for $2"; exit 1; }
            actual=$(sha256 "$1" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || {
              echo "::error::checksum mismatch for $2: got $actual, expected $expected"
              exit 1
            }
          }

          sc_file="shellcheck-${SHELLCHECK_VERSION}.${sc_os}.${sc_arch}.tar.xz"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${sc_file}" -o "$sc_file"
          verify "$sc_file" "$sc_file"
          tar -xJf "$sc_file" --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"

          fmt_file="shfmt_${SHFMT_VERSION}_${fmt_os}_${fmt_arch}"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/${fmt_file}" -o "$fmt_file"
          verify "$fmt_file" "$fmt_file"
          install -m 755 "$fmt_file" /usr/local/bin/shfmt

      # check.sh skips a tool it cannot find, which would turn this job green
      # without having linted anything. Assert the tools are present, and that
      # they are the versions asked for rather than something already on PATH.
      - name: Tools are the pinned versions
        run: |
          for t in shellcheck shfmt zsh jq python3; do
            command -v "$t" > /dev/null || { echo "::error::$t missing"; exit 1; }
          done
          shellcheck --version | grep -qx "version: 0.11.0" || {
            echo "::error::unexpected shellcheck: $(shellcheck --version | tr '\n' ' ')"
            exit 1
          }
          [ "$(shfmt --version)" = "v3.13.1" ] || {
            echo "::error::unexpected shfmt: $(shfmt --version)"
            exit 1
          }

      - run: ./check.sh
