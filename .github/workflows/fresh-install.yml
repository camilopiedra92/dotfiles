# Proves the declared packages still install on a machine that has none of them.
#
# check.sh tests install.sh against stubs, which proves its logic and nothing
# about the world it installs from: a formula renamed, a cask removed, a mise
# version that no longer resolves. Those rot silently and surface on the day a
# new Mac is set up, which is the worst day to find out. This runs the same
# commands install.sh runs for packages (steps 2, 5 and 8a) on a runner image
# that has none of this repo's tools, weekly and on any change to what it reads.
#
# What it deliberately does not run is install.sh itself: that registers an SSH
# signing key on the GitHub account of whoever runs it and asks for a browser
# login, and a CI run must not touch either. Running it with those steps
# faked would test the fake.
name: Fresh install

on:
  schedule:
    # Mondays 06:41, off the hour for the reason tool-updates.yml gives.
    - cron: "41 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Brewfile
      - macos/machines/*/Brewfile
      - mise/config.toml
      - .github/workflows/fresh-install.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --no-upgrade, as install.sh has it: the question is whether everything
      # declared installs, not whether the runner's preinstalled copies are
      # current.
      - name: Brewfile
        run: brew bundle install --no-upgrade --file=Brewfile

      # One run per profile, so a Brewfile for the Mac that is not the one
      # being used today cannot rot unseen.
      - name: Machine Brewfiles
        run: |
          for f in macos/machines/*/Brewfile; do
            echo "::group::$f"
            brew bundle install --no-upgrade --file="$f"
            echo "::endgroup::"
          done

      # install.sh links this file to ~/.config/mise/config.toml before it runs
      # `mise install`; pointing mise at the file reads the same declarations
      # without linking anything.
      - name: Runtimes
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
        run: mise install
