# Pinning actions to a commit SHA is what stops a moved tag from silently
# changing what runs in CI. The cost is that a pinned SHA never picks up
# security fixes on its own, so pinning without something to renew it just
# trades one risk for another. This is that something: Dependabot opens a PR
# when a pinned action moves, and updates the trailing version comment with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release yanked or found compromised in its first days is the usual
    # supply-chain shape; waiting a week lets that surface before a PR exists
    # (zizmor: dependabot-cooldown).
    cooldown:
      default-days: 7
    commit-message:
      # Matches the style of the rest of the history: a plain imperative
      # subject, no conventional-commits prefixes.
      prefix: ""
  # The worker image's agents (containers/worker/package.json, FR-032): the
  # same cadence and cooldown. A PR here moves package.json's exact pins and
  # the lockfile with them; the check
  # "the worker's inventory lists exactly the npm packages its lockfile
  # installs" fails until inventory.txt is regenerated from a fresh build, so
  # nothing merges with an inventory prepare-worker would refuse.
  - package-ecosystem: npm
    directory: /containers/worker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ""
