# Which schema validates which config, for both taplo's CLI and the editor
# extension built on it — one association, read by both, so the check and the
# autocomplete cannot disagree about what a valid key is.
#
# The schemas are vendored under schemas/ and referenced by path rather than by
# their upstream URL. A gate must not need the network: a check that goes red
# because DNS blinked teaches you to ignore it, which is worse than not having
# it. Vendoring also puts a schema change in a diff somebody reads, the same
# reasoning as the pinned tool hashes in .github/tool-checksums.txt.
#
# The cost is that a vendored schema goes stale, and stale here means a key
# upstream has added is reported as invalid. drift.sh is what notices: it
# already asks the network the questions this file cannot.

# The one formatter option written down, and it is not here because it is the
# default -- it happens to be, and restating a default normally buys nothing
# today while refusing a better one tomorrow. It is here because a better one
# does not exist: reordering these keys alphabetically is not a preference this
# project might come round to, it is permanently wrong. starship.toml pairs
# success_symbol with error_symbol and puts truncation_length before
# truncate_to_repo because that is the order they are read in; sorted, the
# grouping is gone and nothing is gained.
#
# The vector is not hypothetical either. `taplo fmt`, without --check, is the
# obvious thing to run after the format check fails, and unlike the check it
# writes. If this option's default ever moved, that command would quietly
# rewrite the ordering of every config here on its way to fixing whitespace.
#
# indent_string, column_width and align_entries are deliberately absent: those
# are preferences, a better upstream default would be welcome, and pinning them
# would refuse it.
[formatting]
reorder_keys = false

[[rule]]
include = ["starship.toml"]

[rule.schema]
path = "schemas/starship.json"

[[rule]]
include = ["mise/config.toml"]

[rule.schema]
path = "schemas/mise.json"
