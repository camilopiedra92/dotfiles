[tools]
# A major, not "lts", and that is a deliberate choice with an expiry date.
#
# 26 is Current today: it entered on 2026-04-21 and becomes Active LTS on
# 2026-10-28, supported until 2029-04-30. Asking for it by number is the only
# way to be on it before that date, since "lts" resolves to 24 until then.
#
# The two converge in October. Once 26 is the LTS, changing this back to "lts"
# is a no-op that restores the tracking -- the pin moves on its own again
# instead of freezing here until someone remembers to edit it. Do that then.
#
# What this is NOT is "latest". That would land on 27 next October, and
# odd-numbered majors never become LTS: they ship in October and are out of
# support roughly six months later. Node 25 is the cautionary example -- it
# reached end of life on 2026-06-01 and Homebrew was still serving it.
node = "26"

# Python has no LTS, and none of the reasoning above transfers to it. Every
# stable release gets the same five years -- two of bugfixes, three of security
# -- so there is no parity trap to sidestep and no date to wait for. The newest
# stable simply is the recommended one.
#
# 3.14 shipped 2025-10-07 and is supported until 2030-10-31. Staying on 3.13 was
# only ever worth it while the ecosystem caught up on wheels, and ten months is
# well past that.
#
# The minor is pinned rather than "latest" for the one reason that does apply:
# 3.15 arrives this October and the C-extension packages that matter will take
# months to publish wheels for it. Bumping this by hand once a year is the
# deliberate step that "latest" would take for you at the worst moment.
#
# Two versions, and the second one is not a preference. The gcloud CLI ships no
# interpreter: it takes the first python3 it finds, and on this machine that was
# a python.org 3.13 under /usr/local/bin that nothing here declared. Naming an
# interpreter for it (CLOUDSDK_PYTHON, in zsh/.zshenv) is what lets that one go,
# and the version is not free to choose -- gcloud 557 supports 3.10 through 3.14
# but gsutil refuses anything above 3.13, so 3.13 is the only end of the range
# that satisfies both. Measured, not assumed: 3.14 makes gsutil exit with
# "requires Python version 3.9-3.13".
#
# First in the list is the default, so `python` and `python3` still resolve to
# 3.14 everywhere; 3.13 exists to be pointed at by name. It leaves when gsutil
# does -- `gcloud storage` is its replacement upstream, and once nothing here
# calls gsutil this drops back to a single version.
python = ["3.14", "3.13"]
