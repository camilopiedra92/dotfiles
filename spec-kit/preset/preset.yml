schema_version: "1.0"

# Appends to two core skills instead of replacing them, so upstream changes to
# the rest of each skill still arrive. Verified on 1.1.0 (2026-10-05) by
# installing a probe preset: the composed SKILL.md kept the core text and ended
# with the appended one, and removing the preset restored the core file. The
# fragments carry no frontmatter: a description there replaced the skill's own,
# which is what Claude reads to decide when to invoke it.
#
# No template overrides: commands are the path that was tested. Note that any
# installed preset, this one included, sends every template the scripts resolve
# through PyYAML, which mise's python lacks; SPECKIT_PYTHON_EXECUTABLE in
# zsh/.zshenv supplies one, and sdd-init refuses to run without it.
preset:
  id: "test-first"
  name: "Test-first"
  version: "1.0.0"
  description: "Makes test tasks mandatory and test-first verifiable in tasks and implement"
  author: "camilopiedra"
  repository: "https://github.com/camilopiedra92/dotfiles"
  license: "MIT"

requires:
  speckit_version: ">=1.1.0"

provides:
  templates:
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Test tasks are required, one behaviour per task, requirement IDs cited"
      strategy: "append"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "A test counts once it has failed from inside, and a task closes on a passing run"
      strategy: "append"
