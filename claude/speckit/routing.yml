# The routing defaults of the sdd-routed workflow (specs/003-sdd-model-routing,
# contracts/routing.md): per phase, the agent, model, effort and permissions
# each step runs with. The workflow (sdd-routed.yml) names none of these; a
# phase's model or effort changes here, or in a repository's layer
# (.claude/sdd-routing.yml, .claude/sdd-routing.local.yml, `sdd-run start
# --set`), which may change only model, effort and timeout.
#
# Validated by ./check.sh against schemas/routing-table.schema.json; each
# workflow step's timeout is its row's max_timeout plus 300, so the
# dispatcher's own limit always fires first (research R11).
#
# Models are full ids, never aliases (spec, Assumptions); the owner's choice
# of 2026-10-21: Opus for judgment, Sonnet for tasks and the default
# implementer, DeepSeek V4 Flash through pi when a repository opts in.
phases:
  specify:
    agent: claude
    model: claude-opus-5-5
    effort: medium
    profile: author
    prompt: /speckit-specify
    # <new> is the one feature directory the pass may create (contracts/routing.md).
    writes: [specs/<new>/spec.md, specs/<new>/checklists/requirements.md, .specify/feature.json]
    timeout: 3600
    max_timeout: 7200
  clarify-ask:
    agent: claude
    model: claude-opus-5-5
    effort: medium
    profile: author
    # Unattended: nobody answers in the pass, so the questions go to a file
    # the owner answers at the answer_clarify checkpoint (FR-005).
    prompt: >-
      /speckit-clarify Ask nothing interactively. Write at most five questions,
      each with your recommended answer, to clarify-questions.md in the feature
      directory, and return how many you wrote; zero when the spec needs none.
    writes: [<f>/clarify-questions.md]
    schema: clarify
    timeout: 3600
    max_timeout: 7200
  clarify-apply:
    agent: claude
    model: claude-opus-5-5
    effort: medium
    profile: author
    prompt: >-
      /speckit-clarify The owner's answers are in clarify-questions.md in the
      feature directory. Apply them to the spec. Ask nothing.
    writes: [<f>/spec.md, <f>/clarify-questions.md]
    timeout: 3600
    max_timeout: 7200
  plan:
    agent: claude
    model: claude-opus-5-5
    effort: medium
    profile: author
    prompt: /speckit-plan
    writes: [<f>/plan.md, <f>/research.md, <f>/data-model.md, <f>/quickstart.md, <f>/contracts/**]
    timeout: 3600
    max_timeout: 7200
  checklist:
    agent: claude
    model: claude-opus-5-5
    effort: medium
    profile: author
    prompt: /speckit-checklist
    writes: [<f>/checklists/**]
    timeout: 3600
    max_timeout: 7200
  checklist-review:
    agent: claude
    model: claude-opus-5-5
    effort: medium
    profile: author
    # The owner's process: a fresh context reviews each checklist before
    # tasks, marking what it verifies; what stays unchecked the owner sees at
    # the plan checkpoint, which answers implement's unchecked-items question
    # (research R27). No Spec Kit command does this; this is its whole brief.
    prompt: >-
      Checklist-review: as someone who did not write them, review every
      checklist in the feature directory against its spec.md and plan.md.
      Mark [x] each item you verify is met, citing where; leave each item you
      cannot verify unchecked, with a one-line note saying why. Change no
      other file.
    writes: [<f>/checklists/**]
    timeout: 3600
    max_timeout: 7200
  analyze:
    agent: claude
    model: claude-opus-5-5
    effort: medium
    profile: reader
    # Spec Kit's analyze is read-only; the dispatcher writes its report.
    prompt: /speckit-analyze
    writes: []
    result_to: analysis.md
    timeout: 3600
    max_timeout: 7200
  tasks:
    agent: claude
    model: claude-sonnet-5-5
    effort: medium
    profile: author
    prompt: /speckit-tasks
    writes: [<f>/tasks.md]
    timeout: 1800
    max_timeout: 3600
  implement-deepseek:
    agent: pi
    model: deepseek-flash
    effort: high
    # Spec Kit's own implement command through its native pi integration
    # (.pi/prompts/speckit.implement.md; pi spells it with a dot), as Claude
    # runs it through its skill: both implementers follow the same Spec Kit
    # procedure, and the run's brief (claude/speckit/brief.md, frozen in the
    # bundle) follows the prompt for both (US2 AS6).
    prompt: /speckit.implement
    writes: ["**"]
    timeout: 1800
    max_timeout: 3600
  implement-sonnet:
    agent: claude
    model: claude-sonnet-5-5
    effort: medium
    profile: implementer
    prompt: /speckit-implement
    writes: ["**"]
    timeout: 1800
    max_timeout: 3600
  review:
    agent: claude
    model: claude-opus-5-5
    effort: medium
    profile: reader
    # No Spec Kit command reviews a diff; this is the review's whole brief
    # (FR-019).
    prompt: >-
      Review, as someone who did not write it, the change in /input/diff.patch
      (the run's whole diff against its base) against the feature's spec,
      plan and tasks. Report each finding with its severity — CRITICAL, HIGH,
      MEDIUM or LOW — and its path; a deleted or weakened test, or a weakened
      check, is HIGH at least. List as done only the task ids the diff
      completes. Change no file.
    writes: []
    schema: review
    timeout: 3600
    max_timeout: 7200
  converge:
    agent: claude
    model: claude-opus-5-5
    effort: medium
    profile: author
    prompt: /speckit-converge
    writes: [<f>/tasks.md]
    schema: converge
    timeout: 3600
    max_timeout: 7200
